[phases.setup]
nixPkgs = ["..."]

[phases.build]
cmds = [
    "mkdir -p /app/storage/logs",
    "chmod +x /assets/queue-worker.sh",
    "..."
]

[start]
cmd = '/assets/start-with-worker.sh'

[staticAssets]
"queue-worker.sh" = '''
#!/bin/bash
# Queue worker script with auto-restart
while true; do
    php /app/artisan queue:work --queue=emails --sleep=3 --tries=3 --max-time=3600 >> /app/storage/logs/queue-worker.log 2>&1
    sleep 5
done
'''

"start-with-worker.sh" = '''
#!/bin/bash

# Start queue worker in background
nohup /assets/queue-worker.sh > /dev/null 2>&1 &

# Find and execute nixpacks default start script
START_SCRIPT=$(find /nix/store -path "*/bin/start-server" -type f 2>/dev/null | head -1)

if [ -n "$START_SCRIPT" ] && [ -f "$START_SCRIPT" ]; then
    # Use nixpacks default start script (handles nginx and PHP-FPM correctly)
    exec "$START_SCRIPT"
else
    # Fallback: let nixpacks use its default PHP start behavior
    # Don't override - let nixpacks handle it
    exec sh -c "php-fpm -D && nginx -g 'daemon off;'"
fi
'''
