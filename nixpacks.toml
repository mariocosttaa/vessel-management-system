[phases.setup]
nixPkgs = ["...", "python311Packages.supervisor"]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "mkdir -p /var/log/supervisor",
    "mkdir -p /var/run",
    "cp /assets/worker-laravel.conf /etc/supervisor/conf.d/",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = '/assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/bin/bash

# Create supervisor directories if they don't exist
mkdir -p /var/log/supervisor
mkdir -p /var/run

# Transform the nginx configuration (nixpacks default)
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Start queue worker in background using supervisor
cat > /etc/supervisord.conf <<EOF
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=emails --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
EOF

# Start supervisor for queue worker in background
supervisord -c /etc/supervisord.conf &

# Try to find nixpacks default start script
START_SCRIPT=$(find /nix/store -name "start-server" -type f 2>/dev/null | head -1)
if [ -n "$START_SCRIPT" ] && [ -f "$START_SCRIPT" ]; then
    # Use nixpacks default start script if available
    exec "$START_SCRIPT"
else
    # Fallback: start PHP-FPM and nginx manually
    # Try common PHP-FPM config locations
    PHP_FPM_STARTED=false
    for conf in /etc/php*/fpm/php-fpm.conf /etc/php-fpm.conf /usr/etc/php-fpm.conf; do
        if [ -f "$conf" ]; then
            php-fpm -F -y "$conf" &
            PHP_FPM_STARTED=true
            break
        fi
    done
    
    # If no config found, try without config (may use defaults)
    if [ "$PHP_FPM_STARTED" = false ]; then
        php-fpm -F &
    fi
    
    # Start nginx in foreground (keeps container alive)
    exec nginx -g "daemon off;"
fi
'''


"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=emails --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

